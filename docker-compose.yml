services:
  app:
    image: xursanov70/build-your-test:2.0.0
    container_name: laravel_app
    volumes:
      - build_your_test_storage:/var/www/storage
      - build_your_test_database:/var/www/database
    env_file:
      - .env
    networks:
      - laravel_network
    restart: unless-stopped

  web:
    image: xursanov70/nginx-conf:1.0.1
    container_name: laravel_web
    ports:
      - "3170:80"
    # volumes:
    #   - ./nginx.conf:/etc/nginx/conf.d/default.conf
    #   - .:/var/www
    depends_on:
      - app
    networks:
      - laravel_network
    restart: unless-stopped

  jprq:
    image: alpine:latest
    container_name: jprq_tunnel
    command: >
      sh -c "apk add curl libc6-compat &&
             curl -fsSL https://jprq.io/install.sh | sh &&
             /usr/local/bin/jprq --version &&
             /usr/local/bin/jprq auth wDqSutIj03Cq8P2nTjfg2wprWS0CfH23HeyN &&
             exec /usr/local/bin/jprq http 3170 -s build-your-test"
    env_file:
      - .env
    depends_on:
      - web
    network_mode: host
    restart: unless-stopped

networks:
  laravel_network:
    driver: bridge

volumes:
  build_your_test_storage:
  build_your_test_database:
