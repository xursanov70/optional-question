services:
  app:
    image: xursanov70/build-your-test:1.0.5
    container_name: laravel_app
    volumes:
      - laravel_data:/var/www
    env_file:
      - .env
    networks:
      - laravel_network
    restart: unless-stopped # Added restart policy

  web:
    image: nginx:latest
    container_name: laravel_web
    ports:
      - "8010:80"
    volumes:
      - laravel_data:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel_network
    restart: unless-stopped # Added restart policy

  jprq:
    image: alpine:latest
    container_name: jprq_tunnel
    command: >
      sh -c "apk add curl libc6-compat &&
             curl -fsSL https://jprq.io/install.sh | sh &&
             /usr/local/bin/jprq --version &&
             /usr/local/bin/jprq auth wDqSutIj03Cq8P2nTjfg2wprWS0CfH23HeyN &&
             exec /usr/local/bin/jprq http 8010 -s build-your-test"
    env_file:
      - .env
    depends_on:
      - web
    network_mode: host # Tashqi 8000-portga ulanish uchun
    restart: unless-stopped # Added restart policy

networks:
  laravel_network:
    driver: bridge

volumes:
  laravel_data:
